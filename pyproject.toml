[project]
name = "mini-vllm"
version = "0.1.0"
description = "A minimal LLM inference engine with KV caching, prefill/decode separation, and continuous batching."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "torch>=2.1",
    "transformers>=4.40,<5",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 88
