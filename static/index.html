<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mini-vLLM</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #161922;
    --border: #262b38;
    --text: #e6e8ee;
    --muted: #8890a4;
    --accent: #5b8cff;
    --user-bubble: #24304a;
    --assistant-bubble: #1c202b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 6px #3ddc84;
  }
  #stats {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #stats span b { color: var(--text); font-weight: 600; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg.assistant.pending::after {
    content: "▍";
    animation: blink 1s step-start infinite;
    color: var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .empty {
    margin: auto;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  #composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 16px 16px;
  }
  #composer-inner {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    background: #0d0f14;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 140px;
  }
  textarea:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.stop { background: #e5484d; }
  #controls {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--muted);
    align-items: center;
  }
  #controls label { display: flex; gap: 6px; align-items: center; }
  #controls input[type="number"] {
    width: 56px;
    background: #0d0f14;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 12px;
  }
  #controls input[type="range"] { width: 90px; }
</style>
</head>
<body>
  <header>
    <h1><span class="dot"></span> mini-vLLM</h1>
    <div id="stats">
      <span>active <b id="stat-active">0</b></span>
      <span>batch <b id="stat-batch">0</b></span>
      <span>tok/s <b id="stat-tps">0</b></span>
    </div>
  </header>

  <div id="chat"><div class="empty">Send a message. GPT-2 isn't instruction-tuned, so expect drifty replies — the point is watching the engine work, not the answer quality.</div></div>

  <div id="composer">
    <div id="composer-inner">
      <div id="row">
        <textarea id="input" rows="1" placeholder="Message mini-vLLM..."></textarea>
        <button id="send">Send</button>
      </div>
      <div id="controls">
        <label>max_tokens <input id="max-tokens" type="number" value="64" min="1" max="512" /></label>
        <label>temperature <input id="temperature" type="range" min="0" max="2" step="0.1" value="0" />
          <span id="temp-val">0.0</span>
        </label>
      </div>
    </div>
  </div>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const maxTokensEl = document.getElementById("max-tokens");
const tempEl = document.getElementById("temperature");
const tempVal = document.getElementById("temp-val");

let history = [];
let inFlight = null; // AbortController for the current stream

tempEl.addEventListener("input", () => { tempVal.textContent = parseFloat(tempEl.value).toFixed(1); });

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});
sendBtn.addEventListener("click", () => {
  if (inFlight) { inFlight.abort(); return; }
  send();
});

function clearEmpty() {
  const empty = chatEl.querySelector(".empty");
  if (empty) empty.remove();
}

function addBubble(role, text) {
  clearEmpty();
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  inputEl.style.height = "auto";

  addBubble("user", text);
  history.push({ role: "user", content: text });

  const bubble = addBubble("assistant", "");
  bubble.classList.add("pending");
  const meta = document.createElement("div");
  meta.className = "meta";
  bubble.after(meta);

  sendBtn.textContent = "Stop";
  sendBtn.classList.add("stop");
  const controller = new AbortController();
  inFlight = controller;
  const startedAt = performance.now();
  let firstTokenAt = null;
  let tokenCount = 0;

  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        messages: history,
        stream: true,
        max_tokens: parseInt(maxTokensEl.value, 10) || 64,
        temperature: parseFloat(tempEl.value) || 0,
      }),
    });

    if (!res.ok) {
      const err = await res.text();
      bubble.textContent = `[error ${res.status}] ${err}`;
      bubble.classList.remove("pending");
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let full = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split("\n\n");
      buf = events.pop();
      for (const evt of events) {
        const line = evt.split("\n").find((l) => l.startsWith("data: "));
        if (!line) continue;
        const payload = line.slice(6);
        if (payload === "[DONE]") continue;
        const json = JSON.parse(payload);
        const delta = json.choices?.[0]?.delta?.content;
        if (delta) {
          if (firstTokenAt === null) firstTokenAt = performance.now();
          tokenCount++;
          full += delta;
          bubble.textContent = full;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      }
    }

    history.push({ role: "assistant", content: full });
    const ttft = firstTokenAt ? ((firstTokenAt - startedAt) / 1000).toFixed(2) : "-";
    const total = ((performance.now() - startedAt) / 1000).toFixed(2);
    meta.textContent = `${tokenCount} tokens · ttft ${ttft}s · total ${total}s`;
  } catch (e) {
    if (e.name !== "AbortError") {
      bubble.textContent += "\n[stream error]";
    }
  } finally {
    bubble.classList.remove("pending");
    sendBtn.textContent = "Send";
    sendBtn.classList.remove("stop");
    inFlight = null;
  }
}

async function pollStats() {
  try {
    const res = await fetch("/metrics");
    const m = await res.json();
    document.getElementById("stat-active").textContent = m.requests.active;
    document.getElementById("stat-batch").textContent = m.batching.current_batch_size;
    document.getElementById("stat-tps").textContent = m.tokens.output_tokens_per_second;
  } catch (e) { /* server still starting */ }
}
setInterval(pollStats, 1000);
pollStats();
</script>
</body>
</html>
